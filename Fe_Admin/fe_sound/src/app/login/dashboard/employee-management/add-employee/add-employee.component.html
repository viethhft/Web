<div class="modal-overlay" (click)="closeModal('Người dùng đã huỷ thêm')">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title">Thêm người dùng mới</h2>
            <button class="close-button" (click)="closeModal('Người dùng đã huỷ thêm')">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="modal-body">
            <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
                <div class="form-group">
                    <label>Tên hiển thị <span class="required">*</span></label>
                    <input type="text" id="displayName" name="displayName" [(ngModel)]="userDto.displayName" required
                        class="form-input">
                    <div class="error-message" *ngIf="userForm.form.get('displayName')?.touched && userForm.form.get('displayName')?.errors?.['required']">
                        Vui lòng nhập tên hiển thị
                    </div>
                </div>

                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" [(ngModel)]="userDto.email" required class="form-input">
                    <div class="error-message" *ngIf="userForm.form.get('email')?.touched && userForm.form.get('email')?.errors?.['required']">
                        Vui lòng nhập email
                    </div>
                    <div class="error-message" *ngIf="userForm.form.get('email')?.touched && userForm.form.get('email')?.errors?.['email']">
                        Email không hợp lệ
                    </div>
                </div>

                <div class="form-group">
                    <label>Giới tính</label>
                    <select name="gender" [(ngModel)]="userDto.gender" class="form-input">
                        <option [value]="true">Nam</option>
                        <option [value]="false">Nữ</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-button" (click)="closeModal('Người dùng đã huỷ thêm')">Hủy</button>
                    <button type="submit" class="submit-button" [disabled]="isLoading">
                        {{ isLoading ? 'Đang xử lý...' : 'Thêm người dùng' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
