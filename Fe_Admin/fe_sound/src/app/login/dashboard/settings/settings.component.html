<div class="settings-container">
    <h1 class="page-title">Cài đặt hệ thống</h1>

    <div class="settings-card">
        <div class="settings-section">
            <h3 class="section-title">Cài đặt tài khoản</h3>
            <form #profileForm="ngForm" (ngSubmit)="saveAccountChanges(profileForm)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" id="username" name="username" [(ngModel)]="userUpdateForm.name"
                            class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="userUpdateForm.email"
                            class="form-input">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="displayName">Họ và tên</label>
                        <input type="text" id="displayName" name="displayName" [(ngModel)]="userUpdateForm.displayName"
                            placeholder="Nhập họ và tên" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Số điện thoại</label>
                        <input type="text" id="phoneNumber" [(ngModel)]="userUpdateForm.phoneNumber" name="phoneNumber"
                            placeholder="Nhập số điện thoại" class="form-input">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-button">Lưu thay đổi</button>
                </div>
            </form>
        </div>

        <div class="settings-section">
            <h3 class="section-title">Cài đặt mật khẩu</h3>
            <form #changePassForm="ngForm" (ngSubmit)="changePassword(changePassForm)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="oldPassword">Mật khẩu cũ</label>
                        <input type="password" id="oldPassword" name="oldPassword"
                            [(ngModel)]="changePasswordForm.oldPassword" placeholder="***********" class="form-input"
                            required #oldPassword="ngModel">
                        <div class="error-message" *ngIf="oldPassword.touched && oldPassword.errors?.['required']">
                            Vui lòng mật khẩu cũ </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" name="newPassword"
                            [(ngModel)]="changePasswordForm.newPassword" placeholder="***********" class="form-input"
                            required #newPassword="ngModel">
                        <div class="error-message" *ngIf="newPassword.touched && newPassword.errors?.['required']">
                            Vui lòng nhập mật khẩu mới </div>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            [(ngModel)]="changePasswordForm.confirmPassword" placeholder="***********"
                            class="form-input" required #confirmPassword="ngModel">
                        <div class="error-message"
                            *ngIf="confirmPassword.touched && confirmPassword.errors?.['required']">
                            Vui lòng nhập xác nhận mật khẩu mới </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="save-button">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>
