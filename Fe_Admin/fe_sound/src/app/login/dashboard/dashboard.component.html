<div class="dashboard-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" class="logo">
                    <!-- Moon -->
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
                    <!-- Sound waves -->
                    <path d="M9 14.5C9 14.5 10 16.5 12 16.5C14 16.5 15 14.5 15 14.5" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    <!-- Stars -->
                    <circle cx="17" cy="7" r="1" fill="currentColor"></circle>
                    <circle cx="19" cy="11" r="0.5" fill="currentColor"></circle>
                    <circle cx="14" cy="5" r="0.5" fill="currentColor"></circle>
                    <!-- Musical note -->
                    <circle cx="7.5" cy="14" r="1" fill="currentColor"></circle>
                    <path d="M7.5 14V10" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path>
                    <path d="M7.5 10L9 9.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path>
                </svg>
            </div>
            <div class="title-container">
                <h1 class="title">SoundSleep</h1>
                <p class="subtitle">Quản lý hệ thống</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-item" routerLinkActive="active" [routerLink]="['overview']"
                *ngIf="authService.isAuthorized(['ADMIN','STAFF']) | async">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Tổng quan</span>
            </button>

            <button class="nav-item" routerLinkActive="active" [routerLink]="['employee-management']"
                *ngIf="authService.isAuthorized(['ADMIN']) | async">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>Quản lý nhân viên</span>
            </button>

            <button class="nav-item" routerLinkActive="active" [routerLink]="['music-management']"
                *ngIf="authService.isAuthorized(['ADMIN','STAFF']) | async">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span>Quản lý âm nhạc</span>
            </button>

            <button class="nav-item" routerLinkActive="active" [routerLink]="['settings']"
                *ngIf="authService.isAuthorized(['ADMIN','STAFF']) | async">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                <span>Cài đặt</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-button" (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <!-- Sound wave animation in header -->
            <div class="sound-wave-container">
                <div class="sound-wave-wrapper">
                    <div class="sound-wave-bars">
                        <ng-container *ngFor="let i of [].constructor(50); let index = index">
                            <div class="sound-wave-bar" [style.height.px]="getSoundWaveHeight(index)"
                                [style.animation-delay.s]="index * 0.05" [style.animation-duration.s]="1"></div>
                        </ng-container>
                    </div>
                </div>
            </div>

            <div class="header-left">
                <button class="menu-button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="search-container">
                <div class="search-input-wrapper">

                </div>
            </div>

            <div class="header-right">
                <button class="notification-button">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-badge">3</span>
                </button>

                <div class="user-dropdown">
                    <button class="user-dropdown-button">
                        <div class="user-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <span class="user-name">{{name}}</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main content area -->
        <main class="content">
            <router-outlet *ngIf="isConfirm; else firstLogin"></router-outlet>
            <ng-template #firstLogin>
                <div class="first-login-container">
                    <div class="code-First-Login">
                        <div class="code-First-Login-content">
                            <h2>Xác nhận lần đầu đăng nhập</h2>

                            <p class="description">Nhập mã xác nhận được gửi đến email của bạn để hoàn tất lần đăng nhập
                                đầu tiên.
                            </p>
                            <form [formGroup]="firstLoginForm" (ngSubmit)="onSubmitSendCodeFirstLogin()">
                                <div class="form-group">
                                    <label for="codeFirstLogin">Mã xác nhận</label>
                                    <input id="codeFirstLogin" type="codeFirstLogin" formControlName="codeFirstLogin"
                                        placeholder="Vui lòng nhập mã xác nhận lần đàu đăng nhập"
                                        [class.invalid]="firstLoginForm.get('codeFirstLogin')?.invalid && firstLoginForm.get('codeFirstLogin')?.touched">
                                </div>
                                <div class="error-message">
                                    <span
                                        *ngIf="firstLoginForm.get('codeFirstLogin')?.invalid && firstLoginForm.get('codeFirstLogin')?.touched">Mã
                                        xác nhận lần đầu đăng nhập là bắt buộc.</span>
                                    <span *ngIf="firstLoginForm.get('codeFirstLogin')?.errors?.minlength">Mã xác nhận
                                        dài 6 kí
                                        tự.</span>
                                    <span *ngIf="firstLoginForm.get('codeFirstLogin')?.errors?.maxlength">Mã xác nhận
                                        dài 6 kí
                                        tự.</span>
                                </div>
                                <div *ngIf="errorMessage" class="error-message">
                                    <span>{{errorMessage}}</span>
                                </div>
                                <button type="submit" class="submit-button"
                                    [disabled]="IsLoading || firstLoginForm.invalid">
                                    {{ IsLoading ? 'Đang xử lý...' : 'Gửi mã xác nhận' }}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

            </ng-template>
        </main>
    </div>
</div>
